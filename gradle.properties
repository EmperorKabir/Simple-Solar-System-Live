org.gradle.jvmargs=-Xmx2048m -Dfile.encoding=UTF-8
# Do NOT redirect the gradle user home (e.g. systemProp.gradle.user.home=.gradle-local):
# it makes gradle ignore ~/.gradle/gradle.properties, so the RELEASE_* signing keys become
# invisible and `./gradlew bundleRelease` silently produces an UNSIGNED AAB. Keep the
# default home so the release signing config wires up automatically.
android.useAndroidX=true
